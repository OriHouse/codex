# orihouse fork (ORIHOUSE.md #2): build the two Linux musl binaries the exit-gate-v2 cells use and
# publish them under upstream's asset names, so the cell Dockerfile only swaps the release base URL.
name: orihouse-release

on:
  push:
    tags:
      - "rust-v*-ori.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing rust-v*-ori.* tag to (re)build
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-unknown-linux-musl
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Cargo build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          cargo build --target "$TARGET" --release --bin codex --bin codex-code-mode-host

      - name: Package (upstream asset names)
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for bin in codex codex-code-mode-host; do
            name="${bin}-${TARGET}"
            cp "target/${TARGET}/release/${bin}" "../dist/${name}"
            strip "../dist/${name}"
            tar -C ../dist -czf "../dist/${name}.tar.gz" "${name}"
          done
          "target/${TARGET}/release/codex" --version
          (cd ../dist && sha256sum ./*.tar.gz | tee SHA256SUMS)

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" \
            --notes "orihouse fork build of ${TAG%-ori.*} (see ORIHOUSE.md)."
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
